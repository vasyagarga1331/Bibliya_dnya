<style>

.seg button{flex:1; min-height:48px; border-radius:12px; border:1.5px solid var(--orange); background:transparent; color:var(--orange); font:600 .95rem system-ui,sans-serif; cursor:pointer}

button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--yellow); outline-offset:2px}
a{color:var(--yellow)}
[hidden]{display:none!important}
#install{width:100%; margin-top:12px; min-height:48px; border-radius:12px; border:1.5px solid var(--yellow); background:transparent; color:var(--yellow); font:600 .95rem system-ui,sans-serif; cursor:pointer}

.ru{color:var(--amber)}

summary{list-style:none; cursor:pointer; min-height:52px; display:flex; align-items:center; justify-content:center; border-radius:14px; background:var(--yellow); color:#000; font:600 1.05rem system-ui,sans-serif}

.text{padding-top:20px}
.ref{color:var(--amber); font:500 .95rem system-ui,sans-serif; margin:0 0 14px}
.warn{margin:22px 0 0; padding:12px 14px; border-radius:12px; border:1.5px solid var(--orange); color:var(--amber); font:.95rem/1.5 system-ui,sans-serif}
.next{margin:36px 0 0; padding-top:18px; border-top:1px solid #2a2a2a; color:var(--amber)}

<script>
/* ===== Книги ===== */
const BOOKS = { "Мф":[40,"Матфея","Mt"], "Мк":[41,"Марка","Mk"], "Лк":[42,"Луки","Lk"], "Ин":[43,"Иоанна","Jn"] };

/* ===== Таблица рядовых Евангельских чтений на литургии (Типикон).
   W[неделя по Пятидесятнице] = [пн, вт, ср, чт, пт, сб, вс]. Недели 33-36: подготовительные недели перед Постом. ===== */
const W = [null,
/*1*/ ["Мф 18:10-20","Мф 4:25,5:1-13","Мф 5:20-26","Мф 5:27-32","Мф 5:33-41","Мф 5:42-48","Мф 10:32-33,37-38,19:27-30"],
/*2*/ ["Мф 6:31-34,7:9-11","Мф 7:15-21","Мф 7:21-23","Мф 8:23-27","Мф 9:14-17","Мф 7:1-8","Мф 4:18-23"],
/*3*/ ["Мф 9:36-10:8","Мф 10:9-15","Мф 10:16-22","Мф 10:23-31","Мф 10:32-36,11:1","Мф 7:24-8:4","Мф 6:22-33"],
/*4*/ ["Мф 11:2-15","Мф 11:16-20","Мф 11:20-26","Мф 11:27-30","Мф 12:1-8","Мф 8:14-23","Мф 8:5-13"],
/*5*/ ["Мф 12:9-13","Мф 12:14-16,22-30","Мф 12:38-45","Мф 12:46-13:3","Мф 13:4-9","Мф 9:9-13","Мф 8:28-9:1"],
/*6*/ ["Мф 13:10-23","Мф 13:24-30","Мф 13:31-36","Мф 13:36-43","Мф 13:44-54","Мф 9:18-26","Мф 9:1-8"],
/*7*/ ["Мф 13:54-58","Мф 14:1-13","Мф 14:35-15:11","Мф 15:12-21","Мф 15:29-31","Мф 10:37-11:1","Мф 9:27-35"],
/*8*/ ["Мф 16:1-6","Мф 16:6-12","Мф 16:20-24","Мф 16:24-28","Мф 17:10-18","Мф 12:30-37","Мф 14:14-22"],
/*9*/ ["Мф 18:1-11","Мф 18:18-22,19:1-2,13-15","Мф 20:1-16","Мф 20:17-28","Мф 21:12-14,17-20","Мф 15:32-39","Мф 14:22-34"],
/*10*/["Мф 21:18-22","Мф 21:23-27","Мф 21:28-32","Мф 21:43-46","Мф 22:23-33","Мф 17:24-18:4","Мф 17:14-23"],
/*11*/["Мф 23:13-22","Мф 23:23-28","Мф 23:29-39","Мф 24:13-28","Мф 24:27-33,42-51","Мф 19:3-12","Мф 18:23-35"],
/*12*/["Мк 1:9-15","Мк 1:16-22","Мк 1:23-28","Мк 1:29-35","Мк 2:18-22","Мф 20:29-34","Мф 19:16-26"],
/*13*/["Мк 3:6-12","Мк 3:13-19","Мк 3:20-27","Мк 3:28-35","Мк 4:1-9","Мф 22:15-22","Мф 21:33-42"],
/*14*/["Мк 4:10-23","Мк 4:24-34","Мк 4:35-41","Мк 5:1-20","Мк 5:22-24,35-43,6:1","Мф 23:1-12","Мф 22:1-14"],
/*15*/["Мк 5:24-34","Мк 6:1-7","Мк 6:7-13","Мк 6:30-45","Мк 6:45-53","Мф 24:1-13","Мф 22:35-46"],
/*16*/["Мк 6:54-7:8","Мк 7:5-16","Мк 7:14-24","Мк 7:24-30","Мк 8:1-10","Мф 24:34-44","Мф 25:14-30"],
/*17*/["Мк 10:46-52","Мк 11:11-23","Мк 11:23-26","Мк 11:27-33","Мк 12:1-12","Мф 25:1-13","Мф 15:21-28"],
/*18*/["Лк 3:19-22","Лк 3:23-4:1","Лк 4:1-15","Лк 4:16-22","Лк 4:22-30","Лк 4:31-36","Лк 5:1-11"],
/*19*/["Лк 4:37-44","Лк 5:12-16","Лк 5:33-39","Лк 6:12-19","Лк 6:17-23","Лк 5:17-26","Лк 6:31-36"],
/*20*/["Лк 6:24-30","Лк 6:37-45","Лк 6:46-7:1","Лк 7:17-30","Лк 7:31-35","Лк 5:27-32","Лк 7:11-16"],
/*21*/["Лк 7:36-50","Лк 8:1-3","Лк 8:22-25","Лк 9:7-11","Лк 9:12-18","Лк 6:1-10","Лк 8:5-15"],
/*22*/["Лк 9:18-22","Лк 9:23-27","Лк 9:44-50","Лк 9:49-56","Лк 10:1-15","Лк 7:2-10","Лк 16:19-31"],
/*23*/["Лк 10:22-24","Лк 11:1-10","Лк 11:9-13","Лк 11:14-23","Лк 11:23-26","Лк 8:16-21","Лк 8:26-39"],
/*24*/["Лк 11:29-33","Лк 11:34-41","Лк 11:42-46","Лк 11:47-12:1","Лк 12:2-12","Лк 9:1-6","Лк 8:41-56"],
/*25*/["Лк 12:13-15,22-31","Лк 12:42-48","Лк 12:48-59","Лк 13:1-9","Лк 13:31-35","Лк 9:37-43","Лк 10:25-37"],
/*26*/["Лк 14:12-15","Лк 14:25-35","Лк 15:1-10","Лк 16:1-9","Лк 16:15-18,17:1-4","Лк 9:57-62","Лк 12:16-21"],
/*27*/["Лк 17:20-25","Лк 17:26-37","Лк 18:15-17,26-30","Лк 18:31-34","Лк 19:12-28","Лк 10:19-21","Лк 13:10-17"],
/*28*/["Лк 19:37-44","Лк 19:45-48","Лк 20:1-8","Лк 20:9-18","Лк 20:19-26","Лк 12:32-40","Лк 14:16-24"],
/*29*/["Лк 20:27-44","Лк 21:12-19","Лк 21:5-7,10-11,20-24","Лк 21:28-33","Лк 21:37-22:8","Лк 13:18-29","Лк 17:12-19"],
/*30*/["Мк 8:11-21","Мк 8:22-26","Мк 8:30-34","Мк 9:10-16","Мк 9:33-41","Лк 14:1-11","Лк 18:18-27"],
/*31*/["Мк 9:42-10:1","Мк 10:2-12","Мк 10:11-16","Мк 10:17-27","Мк 10:23-32","Лк 16:10-15","Лк 18:35-43"],
/*32*/["Мк 10:46-52","Мк 11:11-23","Мк 11:23-26","Мк 11:27-33","Мк 12:1-12","Лк 17:3-10","Лк 19:1-10"],
/*33*/["Мк 12:13-17","Мк 12:18-27","Мк 12:28-37","Мк 12:38-44","Мк 13:1-8","Лк 18:2-8","Лк 18:10-14"],
/*34*/["Мк 13:9-13","Мк 13:14-23","Мк 13:24-31","Мк 13:31-14:2","Мк 14:3-9","Лк 20:45-21:4","Лк 15:11-32"],
/*35*/["Мк 11:1-11","Мк 14:10-42","Мк 14:43-15:1","Мк 15:1-15","Мк 15:22-25,33-41","Лк 21:8-9,25-27,33-36","Мф 25:31-46"],
/*36*/["Лк 19:29-40,22:7-39","Лк 22:39-42,45-23:1",null,"Лк 23:1-34,44-56",null,"Мф 6:1-13","Мф 6:14-21"]
];

/* Пасхальный период: PW[неделя] = [пн..сб], воскресенья по дням после Пасхи */
const PW = [null,
 ["Ин 1:18-28","Лк 24:12-35","Ин 1:35-51","Ин 3:1-15","Ин 2:12-22","Ин 3:22-33"],
 ["Ин 2:1-11","Ин 3:16-21","Ин 5:17-24","Ин 5:24-30","Ин 5:30-6:2","Ин 6:14-27"],
 ["Ин 4:46-54","Ин 6:27-33","Ин 6:35-39","Ин 6:40-44","Ин 6:48-54","Ин 15:17-16:2"],
 ["Ин 6:56-69","Ин 7:1-13","Ин 7:14-30","Ин 8:12-20","Ин 8:21-30","Ин 8:31-42"],
 ["Ин 8:42-51","Ин 8:51-59","Ин 6:5-14","Ин 9:39-10:9","Ин 10:17-28","Ин 10:27-38"],
 ["Ин 11:47-57","Ин 12:19-36","Ин 12:36-47","Лк 24:36-53","Ин 14:1-11","Ин 14:10-21"],
 ["Ин 14:27-15:7","Ин 16:2-13","Ин 16:15-23","Ин 16:23-33","Ин 17:18-26","Ин 21:15-25"]
];
const PS = {0:"Ин 1:1-17",7:"Ин 20:19-31",14:"Мк 15:43-16:8",21:"Ин 5:1-15",28:"Ин 4:5-42",35:"Ин 9:1-38",42:"Ин 17:1-13",49:"Ин 7:37-52,8:12"};

/* Великий пост: ключ = сколько дней осталось до Пасхи (в будни Поста Евангелие на литургии не читается) */
const LENT = {43:"Мк 2:23-3:5",42:"Ин 1:43-51",36:"Мк 1:35-44",35:"Мк 2:1-12",29:"Мк 2:14-17",28:"Мк 8:34-9:1",22:"Мк 7:31-37",21:"Мк 9:17-31",
  15:"Мк 8:27-31",14:"Мк 10:32-45",8:"Ин 11:1-45",7:"Ин 12:1-18",6:"Мф 21:18-43",5:"Мф 22:15-23:39",4:"Ин 12:17-50",3:"Мф 26:1-20",2:"Мф 27:1-56",1:"Мф 28:1-20"};

/* Сезонные субботы и воскресенья (даты по старому стилю): [месяц1,день1,месяц2,день2,чтение] */
const SAT = [[9,7,9,12,"Мф 10:37-11:1"],[12,17,12,23,"Лк 13:18-29"],[12,25,12,30,"Мф 12:15-21"],[12,31,1,4,"Мф 3:1-11"],[1,6,1,12,"Мф 4:1-11"]];
const SUN = [[9,8,9,13,"Ин 3:13-17"],[9,15,9,21,"Мк 8:34-9:1"],[12,11,12,17,"Лк 14:16-24"],[12,18,12,24,"Мф 1:1-25"],[12,26,12,31,"Мф 2:13-23"],[1,1,1,5,"Мк 1:1-8"],[1,7,1,13,"Мф 4:12-17"]];

/* Неподвижные праздники (даты по старому стилю) */
const FEAST = {"9-8":"Лк 10:38-42,11:27-28","9-14":"Ин 19:6-11,13-20,25-28,30-35","9-23":"Лк 1:5-25","10-1":"Лк 10:38-42,11:27-28","11-21":"Лк 10:38-42,11:27-28",
  "12-24":"Лк 2:1-20","12-25":"Мф 2:1-12","1-1":"Лк 2:20-21,40-52","1-5":"Лк 3:1-18","1-6":"Мф 3:13-17","2-2":"Лк 2:22-40","3-25":"Лк 1:24-38",
  "6-24":"Лк 1:5-25,57-68,76,80","6-29":"Мф 16:13-19","8-6":"Мф 17:1-9","8-15":"Лк 10:38-42,11:27-28","8-29":"Мк 6:14-30"};

/* ===== Даты ===== */
const NS = 864e5;
const dnOf = (y,m,d) => Math.floor(Date.UTC(y,m,d)/NS);
const dateOf = dn => new Date(dn*NS);
const nowDn = () => { const d = new Date(); return dnOf(d.getFullYear(), d.getMonth(), d.getDate()); };
const isoOf = dn => dateOf(dn).toISOString().slice(0,10);
function pascha(y){ const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,s=d+e+114; return dnOf(y, Math.floor(s/31)-1, (s%31)+1+13); }
function osOf(dn){ const d = dateOf(dn-13); return {m:d.getUTCMonth()+1, d:d.getUTCDate()}; }
function inWin(o,m1,d1,m2,d2){ const k=o.m*100+o.d, a=m1*100+d1, b=m2*100+d2; return a<=b ? (k>=a&&k<=b) : (k>=a||k<=b); }
const dayAcc = dn => ["в воскресенье","в понедельник","во вторник","в среду","в четверг","в пятницу","в субботу"][(dn+4)%7];

/* ===== Разбор ссылки ===== */
function parse(ref, unc){
  const [ab, rest] = ref.split(" "), b = BOOKS[ab], segs = []; let ch = null, m;
  for (const p of rest.split(",")) {
    if ((m = p.match(/^(\d+):(\d+)-(\d+):(\d+)$/))) { segs.push({c:+m[1], f:+m[2], t:999, cross:1}); segs.push({c:+m[3], f:1, t:+m[4]}); ch = +m[3]; }
    else if ((m = p.match(/^(\d+):(\d+)(?:-(\d+))?$/))) { ch = +m[1]; segs.push({c:ch, f:+m[2], t:m[3] ? +m[3] : +m[2]}); }
    else if ((m = p.match(/^(\d+)(?:-(\d+))?$/))) { segs.push({c:ch, f:+m[1], t:m[2] ? +m[2] : +m[1]}); }
  }
  let best = segs[0], bw = -1;
  for (const s of segs) { const w = s.cross ? 6 : s.t - s.f + 1; if (w > bw) { bw = w; best = s; } }
  return { ref, ab, book:b[0], name:b[1], code:b[2], segs, chapter:best.c, unc:!!unc };
}
const pretty = r => r.replace(/^(\S+) /, "$1. ").replace(/-/g, "–").replace(/,/g, ", ");
const azLink = r => "https://azbyka.ru/biblia/?" + encodeURIComponent(r.code + "." + r.ref.split(" ")[1]);

/* ===== Какое Евангелие читается в день dn ===== */
function gospelFor(dn){
  const y = dateOf(dn).getUTCFullYear();
  const P = dn >= pascha(y) ? pascha(y) : pascha(y-1);
  const Pn = dn < pascha(y) ? pascha(y) : pascha(y+1);
  const k = dn - P, kn = Pn - dn, dow = (dn+4)%7, wd = (dow+6)%7;

  if (k <= 49) { return parse(k===0 || PS[k] ? PS[k] : PW[Math.ceil(k/7)][wd]); }

  const o = osOf(dn), fe = FEAST[o.m+"-"+o.d];
  if (fe) return parse(fe);

  if (kn <= 76) {
    if (kn >= 49) { const sk = kn - ((7-dow)%7), Wn = 33 + (70-sk)/7, r = W[Wn][wd]; return r ? parse(r) : null; }
    return LENT[kn] ? parse(LENT[kn]) : null;
  }

  const pent = P + 49, Wc = Math.ceil((dn-pent)/7), yy = dateOf(pent).getUTCFullYear();
  if (wd === 5) for (const e of SAT) if (inWin(o,e[0],e[1],e[2],e[3])) return parse(e[4]);
  if (wd === 6) for (const e of SUN) if (inWin(o,e[0],e[1],e[2],e[3])) return parse(e[4]);

  if (wd === 6) {
    const Z = Pn - 77;
    if (dn === Z) return parse(W[32][6]);
    let Nf = null;
    for (let d = dnOf(yy,11,24); d <= dnOf(yy,11,30); d++) if ((d+4)%7 === 0) { const oo = osOf(d); if (oo.m===12 && oo.d>=11 && oo.d<=17) Nf = Math.round((d-pent)/7); }
    if (Wc > 29) { const idx = 32 - (Z-dn)/7; if (idx === 30 || idx === 31) return parse(W[idx][6]); return parse(W[29][6], true); }
    if (Wc === 28 && Nf && Nf !== 28) return parse(W[Math.min(Nf,32)][6]);
    return parse(W[Wc][6]);
  }

  let S = dnOf(yy,8,28); S += (7-((S+4)%7))%7;
  const L = S + 1; let G, unc = false;
  if (dn < L) { G = Math.min(Wc,17); if (Wc > 17) unc = true; }
  else { G = 18 + Math.floor((dn-L)/7); if (G > 35) { G = 35; unc = true; } }
  return parse(W[G][wd], unc);
}
function nextReading(dn){ for (let j=1; j<=8; j++) { const r = gospelFor(dn+j); if (r) return Object.assign({}, r, {dn:dn+j}); } return null; }

/* ===== Загрузка текста (Синодальный и церковнославянский) ===== */
const API = "https://api.getbible.net/v2/";
const load = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const save = (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} };
async function getJSON(u){ const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); }
async function translations(){
  const c = load("gb_tr2"); if (c) { try { return JSON.parse(c); } catch(e) {} }
  const j = await getJSON(API + "translations.json");
  const list = Array.isArray(j) ? j.map(t => [t.abbreviation, t]) : Object.entries(j);
  const info = (k,t) => [k, t.translation, t.abbreviation, t.language, t.lang].join(" ").toLowerCase();
  const pick = re => { const f = list.find(([k,t]) => re.test(info(k,t))); return f ? String(f[1].abbreviation || f[0]).toLowerCase() : null; };
  const res = { ru: pick(/synodal|синод/), cs: pick(/church sla|slavonic|slavic|elizabeth|церковнослав|елизавет|елисавет/) };
  if (res.ru) save("gb_tr2", JSON.stringify(res));
  return res;
}
const chCache = {};
async function chapterOf(tr, book, c){
  const key = tr + "/" + book + "/" + c; if (chCache[key]) return chCache[key];
  let data = null, s = load("gb_" + key);
  if (s) { try { data = JSON.parse(s); } catch(e) {} }
  if (!data) {
    const j = await getJSON(API + key + ".json");
    const arr = Array.isArray(j.verses) ? j.verses : Object.values(j.verses || {});
    data = arr.map(x => [+x.verse, String(x.text || "").trim()]);
    save("gb_" + key, JSON.stringify(data));
  }
  return chCache[key] = data;
}
async function loadText(r){
  const tr = await translations(); if (!tr.ru) throw new Error("no translation");
  const out = []; let hasCs = false;
  for (const s of r.segs) {
    const ru = await chapterOf(tr.ru, BOOKS[r.ab][0], s.c);
    let cs = []; if (tr.cs) { try { cs = await chapterOf(tr.cs, BOOKS[r.ab][0], s.c); } catch(e) {} }
    const cm = new Map(cs);
    for (const [v,t] of ru) if (v >= s.f && v <= s.t) { const c2 = cm.get(v) || ""; if (c2) hasCs = true; out.push({c:s.c, v, ru:t, cs:c2}); }
  }
  return { verses: out, hasCs };
}

/* ===== Отображение ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let lang = load("lang"); if (!["cs","ru","both"].includes(lang)) lang = null;
let today = null, nxt = null, tmr = null, shown = -1, TX = {state:"loading", verses:[], hasCs:false}, token = 0;

function para(x, n){
  const num = n ? "<sup>"+n+"</sup>" : "";
  const showCs = lang !== "ru" && x.cs, showRu = lang !== "cs" || !x.cs;
  let h = "";
  if (showCs) h += '<span class="l">'+num+esc(x.cs)+'</span>';
  if (showRu) h += '<span class="l'+(showCs ? " ru" : "")+'">'+(showCs ? "" : num)+esc(x.ru)+'</span>';
  return '<p class="v">'+h+'</p>';
}

function render(){
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  $("#choose").classList.toggle("on", !lang);
  const r = today || nxt;
  if (!r) { $("#main").innerHTML = '<p class="soft">Не удалось определить чтение на сегодня.</p>'; return; }
  const kicker = today ? "Сегодня читается" : "В будни Великого поста Евангелие на литургии не читается. Ближайшее чтение — " + dayAcc(nxt.dn);
  const tm = tmr ? "Завтра читается Евангелие от " + tmr.name + ", " + tmr.chapter + " глава" : "Завтра на литургии Евангелие не читается";
  const iso = isoOf(today ? shown : nxt.dn);
  $("#main").innerHTML =
    '<section class="today"><p class="kicker">'+kicker+'</p><p class="book">Евангелие от '+r.name+'</p>'
    + '<p class="chap"><b>'+r.chapter+'</b><span>глава</span></p><p class="sub">'+pretty(r.ref)+'</p></section>'
    + (r.unc ? '<p class="warn">В эту неделю порядок чтений зависит от года. Лучше сверить с календарём: <a href="https://azbyka.ru/biblia/days/'+iso+'" target="_blank" rel="noopener">Азбука веры</a>.</p>' : '')
    + '<h2>Стих дня</h2><div class="card" id="vod"></div>'
    + '<details><summary>Читать отрывок</summary><div class="text" id="passage"></div></details>'
    + '<p class="next">'+tm+'</p>';
  $("#foot").innerHTML = 'Порядок чтений по Типикону (таблицы Азбуки веры). Текст: Синодальный перевод и церковнославянский, источник getBible. '
    + '<a href="https://azbyka.ru/biblia/days/'+iso+'" target="_blank" rel="noopener">Сверить с церковным календарём</a>';
  fillText();
}

function fillText(){
  const r = today || nxt, vod = $("#vod"), ps = $("#passage"); if (!vod || !r) return;
  const link = '<p class="who"><a href="'+azLink(r)+'" target="_blank" rel="noopener">Открыть отрывок на Азбуке веры</a></p>';
  if (TX.state === "loading") { vod.innerHTML = '<p class="soft">Загружаю текст…</p>'; ps.innerHTML = ""; return; }
  if (TX.state === "fail" || !TX.verses.length) {
    vod.innerHTML = '<p class="v">Текст сейчас не удалось загрузить.</p>' + link;
    ps.innerHTML = '<p class="ref">'+pretty(r.ref)+'</p>' + link; return;
  }
  const x = TX.verses[(today ? shown : nxt.dn) % TX.verses.length];
  vod.innerHTML = para(x) + '<p class="who">'+r.ab+'. '+x.c+':'+x.v+'</p>';
  const note = (lang !== "ru" && !TX.hasCs) ? '<p class="ref">Церковнославянский текст для этого отрывка недоступен, показан русский.</p>' : "";
  ps.innerHTML = '<p class="ref">'+pretty(r.ref)+'</p>' + note + TX.verses.map(v => para(v, v.v)).join("") + link;
}

function refresh(){
  const dn = nowDn(); shown = dn;
  today = gospelFor(dn); nxt = today ? null : nextReading(dn); tmr = gospelFor(dn+1);
  const r = today || nxt, my = ++token;
  TX = {state:"loading", verses:[], hasCs:false};
  render();
  if (!r) return;
  loadText(r).then(t => { if (my === token) { TX = {state:"ok", verses:t.verses, hasCs:t.hasCs}; fillText(); } })
             .catch(() => { if (my === token) { TX = {state:"fail", verses:[], hasCs:false}; fillText(); } });
}

function choose(l){ lang = l; save("lang", l); render(); }
document.querySelectorAll(".seg button, #choose button").forEach(b => b.addEventListener("click", () => choose(b.dataset.l)));
document.addEventListener("visibilitychange", () => { if (!document.hidden && nowDn() !== shown) refresh(); });
setInterval(() => { if (nowDn() !== shown) refresh(); }, 60000);
/* ===== Установка как приложения ===== */
let deferred = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; $("#install").hidden = false; });
$("#install").addEventListener("click", async () => {
  if (!deferred) return;
  deferred.prompt();
  try { await deferred.userChoice; } catch(e) {}
  deferred = null; $("#install").hidden = true;
});
window.addEventListener("appinstalled", () => { $("#install").hidden = true; });
const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
if (isIos && !isStandalone) $("#iosHint").hidden = false;
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

refresh();
</script>
</body>
</html>
